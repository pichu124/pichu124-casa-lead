{% extends "base.html" %}
{% block title %}Đăng nhập · Casa chăm sóc lead{% endblock %}
{% block noi_dung %}
<section class="hop dang-nhap">
  <h1>Casa · Chăm sóc lead</h1>
  {% if loi %}<p class="loi">{{ loi }}</p>{% endif %}
  <form method="post" action="/dang-nhap">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Tên đăng nhập <input name="ten_dang_nhap" autocomplete="username" autocapitalize="none" required></label>
    <label>Mật khẩu <input name="mat_khau" type="password" autocomplete="current-password" required></label>
    <button class="chinh">Đăng nhập</button>
  </form>
  <p class="nho">Quên mật khẩu thì nhờ chủ đặt lại.</p>
</section>
{% endblock %}
